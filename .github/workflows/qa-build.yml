name: Assign QA Build Number

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

concurrency:
  group: qa-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assign-build:
    runs-on: ubuntu-latest

    if: startsWith(github.event.head_commit.message, 'Merge branch ''feature/DSS-')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate QA_BUILD
        shell: bash
        run: |
          if [ ! -f QA_BUILD ]; then
            echo "ERROR: No existe el archivo QA_BUILD"
            exit 1
          fi

          if ! [[ "$(cat QA_BUILD)" =~ ^[0-9]+$ ]]; then
            echo "ERROR: QA_BUILD no contiene un número válido"
            exit 1
          fi

      - name: Calculate next build number
        id: build
        shell: bash
        run: |
          CURRENT=$(cat QA_BUILD)
          NEXT=$((CURRENT + 1))

          echo "$NEXT" > QA_BUILD

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

          echo "Current QA build: $CURRENT"
          echo "Next QA build: $NEXT"

      - name: Commit QA build number
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add QA_BUILD

          git commit -m "[QA-BUILD] ${{ steps.build.outputs.next }}"

          git push
